build:
  nodes:
    php82:
      environment:
        php: 8.2
        redis: false
      dependencies:
        before:
          - command: 'pecl channel-update pecl.php.net && yes "" | pecl install openswoole-25.2.0'
            idle_timeout: 900
      tests:
        override:
          - command: './vendor/bin/phpunit --configuration phpunit.xml --display-errors'
            idle_timeout: 300
